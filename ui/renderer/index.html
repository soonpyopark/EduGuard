<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'"
    />
    <title>EduGuard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="h-screen overflow-hidden bg-slate-100 font-sans text-slate-800 antialiased select-none">
    <div class="flex h-full flex-col">
      <header class="flex items-center gap-3 border-b border-slate-200 bg-white px-6 py-3">
        <img id="logo" class="h-9 w-9 rounded-xl" alt="" />
        <div class="leading-tight">
          <div class="text-base font-bold tracking-tight text-slate-900">EduGuard</div>
          <div class="text-xs text-slate-500">학습 사이트 전용 모드</div>
        </div>
        <span id="version-badge" class="badge ml-2 bg-slate-100 text-slate-600"></span>
        <span id="admin-badge" class="badge hidden bg-amber-50 text-amber-700 ring-1 ring-amber-600/20 ring-inset">
          관리자 권한 아님 · 현재 계정에만 적용
        </span>
        <div class="ml-auto flex items-center gap-1 text-xs text-slate-500">
          개발자
          <button id="dev-link" class="font-medium text-indigo-600 hover:underline"></button>
        </div>
      </header>

      <div id="banners" class="flex flex-col gap-2 px-6 pt-4 empty:hidden"></div>

      <main class="grid min-h-0 flex-1 grid-cols-12 gap-4 p-6">
        <section class="col-span-8 flex min-h-0 flex-col gap-4">
          <div id="hero" class="rounded-3xl bg-linear-to-br from-slate-500 to-slate-700 p-6 text-white shadow-lg">
            <div class="flex items-start justify-between gap-6">
              <div class="min-w-0">
                <div class="text-xs font-semibold tracking-widest text-white/70">현재 상태</div>
                <div id="hero-title" class="mt-1 h-9 text-3xl leading-9 font-bold tracking-tight">연결 중…</div>
                <div id="hero-sub" class="mt-1.5 h-10 text-sm leading-5 text-white/85">EduGuard 엔진에 연결하고 있습니다.</div>
              </div>
              <div class="flex shrink-0 gap-3">
                <div class="min-w-24 rounded-2xl bg-white/15 px-4 py-3 text-center ring-1 ring-white/20">
                  <div class="text-xs text-white/75">허용</div>
                  <div id="count-allowed" class="text-2xl font-bold tabular-nums">0</div>
                </div>
                <div class="min-w-24 rounded-2xl bg-white/15 px-4 py-3 text-center ring-1 ring-white/20">
                  <div class="text-xs text-white/75">차단</div>
                  <div id="count-blocked" class="text-2xl font-bold tabular-nums">0</div>
                </div>
              </div>
            </div>
            <div class="mt-6 grid grid-cols-3 gap-3">
              <button id="btn-start" class="btn btn-hero" disabled>▶ 차단 시작</button>
              <button id="btn-stop" class="btn btn-hero" disabled>■ 차단 해제</button>
              <button id="btn-temp" class="btn btn-hero" disabled>⏱ 일시 해제</button>
            </div>
          </div>

          <div class="card flex min-h-0 flex-1 flex-col">
            <div class="flex items-center gap-2 border-b border-slate-100 px-4 py-3">
              <h2 class="card-title">실시간 접속 로그</h2>
              <span id="log-count" class="badge bg-slate-100 text-slate-500">0</span>
              <div id="log-filters" class="ml-auto flex gap-1"></div>
              <button id="log-clear" class="btn btn-ghost btn-sm">화면 지우기</button>
            </div>
            <div id="log" class="min-h-0 flex-1 overflow-y-auto px-4 py-2 font-mono text-xs leading-6 select-text">
              <div id="log-empty" class="py-10 text-center font-sans text-sm text-slate-400">아직 기록이 없습니다.</div>
            </div>
          </div>
        </section>

        <aside class="col-span-4 flex min-h-0 flex-col gap-4">
          <div class="card flex min-h-0 flex-1 flex-col p-4">
            <div class="flex items-center gap-2">
              <h2 class="card-title">허용 키워드</h2>
              <span id="kw-count" class="badge bg-indigo-50 text-indigo-700">0</span>
              <span class="ml-auto text-xs text-slate-400">도메인에 포함되면 허용</span>
            </div>
            <form id="kw-form" class="mt-3 flex shrink-0 gap-2">
              <input id="kw-input" class="input" placeholder="예: khanacademy" autocomplete="off" />
              <button class="btn btn-primary shrink-0" type="submit">추가</button>
            </form>
            <div id="kw-list" class="mt-3 flex min-h-0 flex-1 flex-wrap content-start gap-1.5 overflow-y-auto rounded-xl bg-slate-50 p-2"></div>
            <div class="mt-3 flex shrink-0 flex-wrap gap-1.5">
              <button id="kw-remove" class="btn btn-danger-soft btn-sm" disabled>선택 삭제</button>
              <button id="kw-reset" class="btn btn-soft btn-sm">기본값 복원</button>
              <button id="kw-import" class="btn btn-soft btn-sm">가져오기</button>
              <button id="kw-export" class="btn btn-soft btn-sm">내보내기</button>
            </div>
            <p class="hint mt-2 shrink-0">키워드를 눌러 선택합니다. 추가·삭제·가져오기는 부모님 비밀번호가 필요합니다.</p>
          </div>

          <div class="card shrink-0 p-4">
            <h2 class="card-title">도메인 허용 여부 테스트</h2>
            <form id="test-form" class="mt-3 flex gap-2">
              <input id="test-input" class="input" placeholder="예: www.ebsi.co.kr 또는 URL" autocomplete="off" />
              <button class="btn btn-soft shrink-0" type="submit">검사</button>
            </form>
            <div id="test-result" class="mt-2 h-10 truncate rounded-xl bg-slate-50 px-3 text-sm leading-10 text-slate-400 ring-1 ring-slate-200 ring-inset">검사 결과가 여기에 표시됩니다.</div>
          </div>
        </aside>
      </main>

      <footer class="flex flex-wrap items-center justify-between gap-x-6 gap-y-3 border-t border-slate-200 bg-white px-6 py-3">
        <div class="flex flex-wrap items-center gap-2">
          <button id="tool-settings" class="btn btn-soft btn-sm">⚙ 환경설정</button>
          <button id="tool-password" class="btn btn-soft btn-sm">🔑 비밀번호 변경</button>
          <button id="tool-proxy" class="btn btn-soft btn-sm">🌐 프록시 상태</button>
          <button id="tool-services" class="btn btn-soft btn-sm">🛠 Windows 서비스</button>
          <button id="tool-version" class="btn btn-soft btn-sm">ℹ 버전 정보</button>
        </div>
        <button id="btn-exit" class="btn btn-danger-soft btn-sm ml-auto">⏻ 프로그램 종료</button>
      </footer>
    </div>

    <div id="overlay" class="fixed inset-0 z-40 flex items-center justify-center bg-slate-100/80 backdrop-blur-sm">
      <div class="card w-96 p-6 text-center">
        <div id="overlay-spinner" class="mx-auto h-10 w-10 animate-spin rounded-full border-4 border-indigo-200 border-t-indigo-600"></div>
        <div id="overlay-title" class="mt-4 text-base font-semibold text-slate-900">엔진에 연결하는 중…</div>
        <div id="overlay-message" class="hint mt-1">관리자 권한 확인(UAC) 창이 뜨면 '예'를 선택해 주세요.</div>
        <button id="overlay-retry" class="btn btn-primary mt-4 hidden">엔진 다시 시작</button>
      </div>
    </div>

    <div id="modal-root"></div>
    <div id="toast-root" class="pointer-events-none fixed right-5 bottom-5 z-[60] flex w-80 flex-col gap-2"></div>

    <script src="app.js"></script>
  </body>
</html>
